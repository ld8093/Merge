proxy-groups:
  - name: "HK Node"
    type: url-test
    include-all: false
    use:
      - NodeProvider2
    filter: "(?i)港|HK|Hong Kong|HongKong|hongkong"
    url: "https://www.gstatic.com/generate_204"
    interval: 1800
    tolerance: 50
    lazy: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png"

  - name: "TW Node"
    type: url-test
    include-all: false
    use:
      - NodeProvider2
    filter: "(?i)台|新北|彰化|TW|Taiwan"
